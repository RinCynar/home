<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RinCynar</title>
    <meta name="description" content="Write to RinCynar." />
    <link rel="canonical" href="https://rincynar.top/contact.html" />
    <link rel="icon" href="/icon/favicon.png" />
    <meta name="theme-color" content="#39C5BB" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/contact/main.js"></script>
  </body>
</html>
