<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RinCynar — Personal Space</title>
    <meta
      name="description"
      content="A personal space for RinCynar — writing, selected work, and the long way forward."
    />
    <link rel="canonical" href="https://rincynar.top/" />
    <link rel="icon" href="/icon/favicon.png" />
    <meta name="theme-color" content="#141318" />
    <meta property="og:title" content="RinCynar — Personal Space" />
    <meta
      property="og:description"
      content="A personal space for RinCynar — writing, selected work, and the long way forward."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rincynar.top/" />
    <meta property="og:image" content="/icon/favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RinCynar — Personal Space" />
    <meta
      name="twitter:description"
      content="A personal space for RinCynar — writing, selected work, and the long way forward."
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
